<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="620" fill="#f4f4f4"/>

  <!-- ===================== ESCRITORIO ===================== -->
  <text x="180" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Escritorio (&gt;900px)</text>
  <g transform="translate(30,50)">
    <rect x="0" y="0" width="300" height="500" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <!-- nav -->
    <rect x="0" y="0" width="300" height="35" fill="#744389" stroke="#333"/>
    <text x="150" y="22" font-size="11" fill="#fff" text-anchor="middle">NAV (6 links en fila)</text>
    <!-- sidebar -->
    <rect x="0" y="35" width="70" height="465" fill="#510074" stroke="#333"/>
    <text x="35" y="150" font-size="10" fill="#fff" text-anchor="middle" transform="rotate(-90 35 150)">SIDEBAR (20%)</text>
    <!-- content -->
    <rect x="70" y="35" width="230" height="465" fill="#FDFBF7" stroke="#333"/>
    <text x="185" y="60" font-size="11" fill="#333" text-anchor="middle">CONTENIDO (80%)</text>
    <rect x="90" y="80" width="190" height="15" fill="#ddd"/>
    <rect x="90" y="105" width="190" height="8" fill="#eee"/>
    <rect x="90" y="118" width="190" height="8" fill="#eee"/>
    <rect x="90" y="131" width="150" height="8" fill="#eee"/>
    <rect x="90" y="155" width="190" height="60" fill="#eef3f7" stroke="#ccc"/>
    <text x="185" y="240" font-size="10" fill="#999" text-anchor="middle">Sidebar y Contenido</text>
    <text x="185" y="253" font-size="10" fill="#999" text-anchor="middle">van uno al lado del otro</text>
  </g>

  <!-- ===================== TABLET ===================== -->
  <text x="600" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Tablet (601px - 900px)</text>
  <g transform="translate(460,50)">
    <rect x="0" y="0" width="280" height="500" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <!-- nav -->
    <rect x="0" y="0" width="280" height="55" fill="#744389" stroke="#333"/>
    <text x="140" y="20" font-size="10" fill="#fff" text-anchor="middle">NAV (envuelve en 2 filas</text>
    <text x="140" y="35" font-size="10" fill="#fff" text-anchor="middle">flex-wrap)</text>
    <!-- sidebar -->
    <rect x="0" y="55" width="84" height="445" fill="#510074" stroke="#333"/>
    <text x="42" y="270" font-size="9" fill="#fff" text-anchor="middle" transform="rotate(-90 42 270)">SIDEBAR (30%)</text>
    <!-- content -->
    <rect x="84" y="55" width="196" height="445" fill="#FDFBF7" stroke="#333"/>
    <text x="182" y="80" font-size="10" fill="#333" text-anchor="middle">CONTENIDO (70%)</text>
    <rect x="100" y="100" width="160" height="12" fill="#ddd"/>
    <rect x="100" y="120" width="160" height="7" fill="#eee"/>
    <rect x="100" y="132" width="160" height="7" fill="#eee"/>
    <rect x="100" y="155" width="160" height="55" fill="#eef3f7" stroke="#ccc"/>
    <text x="182" y="250" font-size="9" fill="#999" text-anchor="middle">Se reducen anchos</text>
    <text x="182" y="262" font-size="9" fill="#999" text-anchor="middle">y espacios (@media 900px)</text>
  </g>

  <!-- ===================== CELULAR ===================== -->
  <text x="1010" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Celular (&lt;600px)</text>
  <g transform="translate(940,50)">
    <rect x="0" y="0" width="140" height="500" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <!-- nav (stacked) -->
    <rect x="0" y="0" width="140" height="26" fill="#744389" stroke="#333"/>
    <text x="70" y="17" font-size="8" fill="#fff" text-anchor="middle">Inicio</text>
    <rect x="0" y="26" width="140" height="26" fill="#744389" stroke="#333"/>
    <text x="70" y="43" font-size="8" fill="#fff" text-anchor="middle">Conceptos</text>
    <rect x="0" y="52" width="140" height="26" fill="#744389" stroke="#333"/>
    <text x="70" y="69" font-size="8" fill="#fff" text-anchor="middle">QFT ...</text>
    <text x="70" y="90" font-size="8" fill="#666" text-anchor="middle">(NAV apilado, uno debajo</text>
    <text x="70" y="100" font-size="8" fill="#666" text-anchor="middle">del otro - flex-direction: column)</text>

    <!-- sidebar (full width, stacked on top) -->
    <rect x="0" y="115" width="140" height="130" fill="#510074" stroke="#333"/>
    <text x="70" y="180" font-size="9" fill="#fff" text-anchor="middle">SIDEBAR</text>
    <text x="70" y="193" font-size="9" fill="#fff" text-anchor="middle">(100% ancho)</text>

    <!-- content (full width, below) -->
    <rect x="0" y="245" width="140" height="255" fill="#FDFBF7" stroke="#333"/>
    <text x="70" y="265" font-size="9" fill="#333" text-anchor="middle">CONTENIDO</text>
    <text x="70" y="277" font-size="9" fill="#333" text-anchor="middle">(100% ancho)</text>
    <rect x="10" y="290" width="120" height="10" fill="#ddd"/>
    <rect x="10" y="308" width="120" height="6" fill="#eee"/>
    <rect x="10" y="318" width="120" height="6" fill="#eee"/>
    <rect x="10" y="335" width="120" height="45" fill="#eef3f7" stroke="#ccc"/>
    <text x="70" y="400" font-size="8" fill="#999" text-anchor="middle">Sidebar y Contenido</text>
    <text x="70" y="411" font-size="8" fill="#999" text-anchor="middle">se apilan verticalmente</text>
    <text x="70" y="422" font-size="8" fill="#999" text-anchor="middle">(cuerpo-flex: column)</text>
  </g>

  <!-- Leyenda -->
  <g transform="translate(30,570)">
    <rect x="0" y="0" width="14" height="14" fill="#744389"/>
    <text x="20" y="12" font-size="12" fill="#333">Navegación (.menu-flex)</text>

    <rect x="220" y="0" width="14" height="14" fill="#510074"/>
    <text x="240" y="12" font-size="12" fill="#333">Barra lateral (.datos-clave)</text>

    <rect x="470" y="0" width="14" height="14" fill="#FDFBF7" stroke="#333"/>
    <text x="490" y="12" font-size="12" fill="#333">Contenido (.contenido)</text>

    <rect x="700" y="0" width="14" height="14" fill="#eef3f7" stroke="#ccc"/>
    <text x="720" y="12" font-size="12" fill="#333">Tabla / caja destacada</text>
  </g>
</svg>
