services:
  web:
    image: nginx:alpine
    container_name: cuantum_computing_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - proj-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cuantum_computing_php
    volumes:
      - ./src:/var/www/html
    networks:
      - proj-network

  db:
    image: mariadb:11
    container_name: cuantum_computing_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mi_base_datos
      MYSQL_USER: estudiante
      MYSQL_PASSWORD: estudiante_pass
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - proj-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cuantum_computing_pma
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - proj-network

networks:
  proj-network:
    driver: bridge

volumes:
  db_data:
